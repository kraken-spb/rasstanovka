name: crewplacement-workforce-staging

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app_environment
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://workforce_app:${PG_APP_PASSWORD:?Generate staging credentials}@postgres:5432/workforce
      SECRET_KEY: ${SECRET_KEY:?Generate staging credentials}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Generate staging credentials}
      APP_ENVIRONMENT: staging
      OUTBOUND_INTEGRATIONS_ENABLED: "false"
      COOKIE_SECURE: "false"
      POOL_MIN_SIZE: "2"
      POOL_MAX_SIZE: "8"
    ports:
      - 127.0.0.1:18090:8000
    volumes:
      - workforce_appdata:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [workforce]
  report-worker:
    image: crewplacement-workforce-staging-app
    command: [python, workforce_jobs.py]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app_environment
      POOL_MIN_SIZE: "1"
      POOL_MAX_SIZE: "2"
    volumes:
      - workforce_appdata:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      disable: true
    networks: [workforce]
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: workforce
      POSTGRES_USER: workforce_owner
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?Generate the staging environment first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - statement_timeout=15000
      - -c
      - idle_in_transaction_session_timeout=30000
      - -c
      - log_min_duration_statement=250
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    ports:
      - 127.0.0.1:55439:5432
    volumes:
      - workforce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U workforce_owner -d workforce]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [workforce]

volumes:
  workforce_pgdata:
  workforce_appdata:

networks:
  workforce:
    driver: bridge
