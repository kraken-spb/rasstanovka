<section id="view-workforce" class="view workforce-view">
  <div id="wf-list-workspace">
  <div class="wf-heading"><div><h1 id="wf-title">Учёт персонала</h1><p id="wf-description">Единая карточка сотрудника · история присутствия и движения</p></div>
    <label>Отчётная дата<input id="wf-date" type="date" value="{{ today }}" required></label>
  </div>
  <div class="wf-workspace-toolbar">
    <nav id="wf-workspaces" class="wf-tabs" aria-label="Рабочие списки учёта"></nav>
    <div class="wf-view-switch" role="group" aria-label="Вид учёта персонала"><button id="wf-view-board" type="button" aria-pressed="true">Доска</button><button id="wf-view-table" type="button" aria-pressed="false">Таблица</button></div>
  </div>
  <div class="wf-stats" id="wf-stats" aria-live="polite"></div>
  <details id="wf-filter-panel" class="wf-filter-panel" open><summary id="wf-filter-summary">Фильтры</summary><div class="wf-toolbar panel">
    <label class="wf-search">Поиск<input id="wf-search" type="search" maxlength="200" placeholder="ФИО или табельный номер"></label>
    <label class="check-label"><input id="wf-regex" type="checkbox"> Regex</label>
    <label>СМУ<select id="wf-department"><option value="">Все доступные</option></select></label>
    <label>Состояние на дату<select id="wf-stage"><option value="">Все состояния</option></select></label>
    <label>Работодатель<select id="wf-employer"><option value="">Все работодатели</option></select></label>
    <label>Категория ГДЛР<select id="wf-category"><option value="">Все категории</option></select></label>
    <label class="check-label"><input id="wf-conflicts" type="checkbox"> С замечаниями</label>
    <button type="button" id="wf-refresh" class="secondary-button">Обновить</button>
  </div></details>
  <div class="wf-list-heading"><span id="wf-count" role="status"></span><div id="wf-table-pagination"><button id="wf-prev" type="button" class="secondary-button" aria-label="Предыдущая страница">←</button><button id="wf-next" type="button" class="secondary-button" aria-label="Следующая страница">→</button></div></div>
  <p id="wf-error" class="error-text" role="alert" hidden></p>
  <div id="wf-board-region" role="region" aria-label="Доска движения персонала"></div>
  <div id="wf-table-region" class="wf-table-region" tabindex="0" role="region" aria-label="Реестр персонала" hidden><table class="wf-table"><thead><tr><th>ФИО / табельный №</th><th>Проект / СМУ</th><th>Работодатель</th><th>Должность</th><th>Категория ГДЛР</th><th>Статус сотрудника</th><th>Состояние на дату</th><th>Заезд / прогноз выезда</th></tr></thead><tbody id="wf-rows"></tbody></table></div>
  </div>
  <section id="wf-card" class="wf-card wf-card-page" aria-labelledby="wf-card-title" hidden>
    <header class="wf-card-heading">
      <button id="wf-card-close" type="button" class="secondary-button" aria-label="Вернуться к списку сотрудников">← <span>К списку</span></button>
      <div class="wf-card-identity"><h1 id="wf-card-title" tabindex="-1">Карточка сотрудника</h1><p id="wf-card-subtitle"></p></div>
      <span id="wf-card-stage" class="wf-tag"></span>
    </header>
    <p id="wf-card-error" class="error-text" role="alert" hidden></p>
    <div class="wf-card-workspace">
      <section id="wf-card-details" class="wf-card-details" aria-label="Данные сотрудника">
        <nav id="wf-card-tabs" class="wf-tabs" aria-label="Разделы карточки"></nav>
        <label class="wf-card-section-picker">Раздел карточки<select id="wf-card-section"></select></label>
        <div id="wf-card-content"></div>
      </section>
      <div id="wf-card-splitter" class="wf-card-splitter" role="separator" tabindex="0" aria-label="Ширина данных сотрудника" aria-orientation="vertical" aria-controls="wf-card-details wf-card-activity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="61" title="Перетащите для изменения ширины. Стрелки ← → — изменить, Enter или двойной щелчок — сбросить."></div>
      <aside id="wf-card-activity" class="wf-card-activity" aria-labelledby="wf-card-activity-title">
        <div class="wf-activity-heading"><h2 id="wf-card-activity-title">История сотрудника</h2><span id="wf-activity-count"></span></div>
        <div id="wf-card-timeline"></div>
      </aside>
    </div>
  </section>
</section>
<script src="{{ asset_url('workforce-board.js') }}" defer></script>
<script src="{{ asset_url('workforce.js') }}" defer></script>
<script src="{{ asset_url('workforce-import.js') }}" defer></script>
<script src="{{ asset_url('workforce-export.js') }}" defer></script>
<script src="{{ asset_url('workforce-catalogs.js') }}" defer></script>
