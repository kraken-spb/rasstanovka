<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Защищённая система расстановки бригад по объектам и сменам">
  <title>Вход — Расстановка</title>
  <link rel="stylesheet" href="{{ asset_url('styles.css') }}">
  <link rel="stylesheet" href="{{ asset_url('action-icons.css') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand" aria-label="Система расстановки">
      <div class="brand-mark" aria-hidden="true">Р</div>
      <div>
        <p class="eyebrow">Управление бригадами</p>
        <h1>Расстановка</h1>
        <p>Информация об оперативной расстановке персонала</p>
      </div>
    </section>
    <section class="login-card">
      <div>
        <p class="eyebrow">Защищённый доступ</p>
        <h2>Войти в систему</h2>
      </div>
      {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" class="stack-form">
        <label>Логин<input name="username" autocomplete="username" required autofocus></label>
        <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">Войти</button>
      </form>
    </section>
  </main>
  <script src="{{ asset_url('action-icons.js') }}" defer></script>
</body>
</html>
