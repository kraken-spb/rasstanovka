services:
  placement:
    build: .
    restart: unless-stopped
    ports:
      - "8088:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Укажите ADMIN_USERNAME в файле .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Укажите ADMIN_PASSWORD в файле .env}
      SECRET_KEY: ${SECRET_KEY:?Укажите SECRET_KEY в файле .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_PATH: /app/data/placement.db
    volumes:
      - placement_data:/app/data

  telegram:
    build: .
    restart: unless-stopped
    command: ["python", "telegram_worker.py"]
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DATABASE_PATH: /app/data/placement.db
    volumes:
      - placement_data:/app/data
    healthcheck:
      test: ["CMD", "python", "telegram_worker.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 30s

volumes:
  placement_data:
