name: report-bi

services:
  placement:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in the server environment file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the server environment file}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the server environment file}
      COOKIE_SECURE: "true"
      DATABASE_PATH: /app/data/placement.db
    volumes:
      - placement_data:/app/data
    expose:
      - "8000"
    networks:
      proxy:
        aliases:
          - report-bi-placement
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  telegram:
    image: report-bi-placement:latest
    restart: unless-stopped
    command: ["python", "telegram_worker.py"]
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DATABASE_PATH: /app/data/placement.db
    volumes:
      - placement_data:/app/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "python", "telegram_worker.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  placement_data:

networks:
  proxy:
    external: true
    name: myberries_net
